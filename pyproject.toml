[project]
name = "melm"
version = "0.1.0"
description = "Validation-first infrastructure for the Morpheme-Event Language Model research program."
readme = "melm/README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["huggingface-hub>=0.33"]
tokenizers = ["tokenizers>=0.21"]
training = ["torch>=2.6"]
llamacpp = ["llama-cpp-python>=0.3", "psutil>=5.9"]
dev = []
normalization = ["symspellpy>=6.9.0"]

[project.scripts]
melm = "melm.__main__:main"

[tool.setuptools.packages.find]
include = ["melm*"]

[tool.setuptools.package-data]
"melm.contracts" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--deselect=tests/test_local_assistant_os_cli_mvp.py::LocalAssistantOSCliMvpTests::test_cli_pi_bundle_builds_portable_self_checked_bundle",
]
markers = [
    "slow: heavy tests that need the full bulk-lexicon seed (run with MELM_BULK_MAX_ENTRIES=0 pytest -m slow)",
]
