name: assistant-os-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .

      - name: Unit and integration tests
        run: python -m pytest -q

      - name: Shortcut audit
        run: python scripts/local_assistant_os_cli.py shortcut-audit --json > shortcut-audit.json

      - name: Pi readiness smoke
        run: python scripts/local_assistant_os_cli.py pi-smoke --reset --json > pi-smoke.json

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-os-gates
          path: |
            shortcut-audit.json
            pi-smoke.json
